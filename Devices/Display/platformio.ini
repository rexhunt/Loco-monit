; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1]
platform = espressif32
;platform = https://github.com/pioarduino/platform-espressif32
board = esp32-s3-devkitc-1
;board_build.partitions = default_16MB.csv
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit NeoPixel@^1.15.5  ;LED Control
    ArduinoOTA
    WiFi
build_flags = 
    -I../libs                           ;Include Loco-Monit libraries

;Adds OTA Updates
[env:esp32_ota]
;extends the settings from the [env:esp32] section
extends = env:esp32-s3-devkitc-1
;To fixed ip address and wifi = Loco, 1234Update
upload_protocol = espota
; IP address of the ESP32
upload_port = 10.0.20.2 
upload_flags = --auth=lonelybinary 