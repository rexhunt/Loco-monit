; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1]
platform = espressif32
;platform = https://github.com/pioarduino/platform-espressif32
;board = esp32-s3-devkitc-1
board = ESP32-S3-WROOM-1-N16R8
board_build.partitions = default_16MB.csv
framework = arduino
monitor_speed = 115200
upload_speed  = 250000
lib_deps =
    ArduinoOTA
    WiFi
	adafruit/Adafruit BusIO@1.17.0
	adafruit/Adafruit SSD1306@2.5.13
    lvgl/lvgl@9.1.0
    lovyan03/LovyanGFX@1.2.26          
    tamctec/TAMC_GT911@1.0.2
build_flags = 
	-D CONFIG_SPIRAM_SPEED_120M=1
    -I ../libs                           ;Include Loco-Monit libraries
    -I ./include                         ;Include location of lv_conf.h
    -I ./lib                            ;Include location of graphics.h
    -D LV_CONF_INCLUDE_SIMPLE           ;LVGL

;Adds OTA Updates
[env:esp32_ota]
;extends the settings from the [env:esp32] section
extends = env:esp32-s3-devkitc-1
;To fixed ip address and wifi = Loco, 1234Update
upload_protocol = espota
; IP address of the ESP32
upload_port = 10.0.20.2 
upload_flags = --auth=lonelybinary 